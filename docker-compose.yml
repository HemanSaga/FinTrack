services:
  mongodb:
    image: mongo:7
    container_name: fintrack-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrack-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/fintrack
      - CLIENT_ORIGIN=http://localhost:4000
      - JWT_SECRET=change-this-to-a-secure-random-secret-key-at-least-32-chars
      - ENABLE_DEMO=true
      - TRUST_PROXY=0
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
